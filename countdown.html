<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5分钟倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 60px 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .timer {
            font-size: 120px;
            font-weight: 700;
            color: #e94560;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(233, 69, 96, 0.4);
            margin-bottom: 20px;
            line-height: 1;
        }

        .timer.warning {
            color: #f5a623;
            text-shadow: 0 0 40px rgba(245, 166, 35, 0.5);
            animation: pulse 0.8s ease-in-out infinite;
        }

        .timer.danger {
            color: #e94560;
            text-shadow: 0 0 60px rgba(233, 69, 96, 0.7);
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .progress-ring {
            transform: rotate(-90deg);
            margin-bottom: 30px;
        }

        .progress-ring__bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .progress-ring__fill {
            fill: none;
            stroke: #e94560;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
        }

        .progress-ring__fill.warning {
            stroke: #f5a623;
        }

        .progress-ring__fill.danger {
            stroke: #e94560;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
            min-width: 100px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4ecca3;
            color: #1a1a2e;
        }
        .btn-start:hover {
            background: #5fe0b8;
            box-shadow: 0 8px 25px rgba(78, 204, 163, 0.4);
        }

        .btn-pause {
            background: #f5a623;
            color: #1a1a2e;
        }
        .btn-pause:hover {
            background: #f7b84e;
            box-shadow: 0 8px 25px rgba(245, 166, 35, 0.4);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="progress-ring" width="220" height="220" viewBox="0 0 220 220">
            <circle class="progress-ring__bg" cx="110" cy="110" r="100" />
            <circle class="progress-ring__fill" cx="110" cy="110" r="100" id="progressCircle" />
        </svg>

        <div class="timer" id="timerDisplay">05:00</div>

        <div class="buttons">
            <button class="btn-start" id="btnStart" onclick="startTimer()">开 始</button>
            <button class="btn-pause" id="btnPause" onclick="pauseTimer()" disabled>暂 停</button>
            <button class="btn-reset" id="btnReset" onclick="resetTimer()">重 置</button>
        </div>

        <div class="status" id="statusText">就绪</div>
    </div>

    <script>
        const TOTAL_SECONDS = 5 * 60; // 5分钟 = 300秒
        const CIRCUMFERENCE = 2 * Math.PI * 100; // 圆周长 ≈ 628.32

        let remainingSeconds = TOTAL_SECONDS;
        let timerInterval = null;
        let isRunning = false;

        // DOM 元素
        const timerDisplay = document.getElementById('timerDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const statusText = document.getElementById('statusText');

        // 初始化进度环
        progressCircle.style.strokeDasharray = CIRCUMFERENCE;
        progressCircle.style.strokeDashoffset = '0';

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(remainingSeconds);

            // 更新进度环
            const progress = remainingSeconds / TOTAL_SECONDS;
            const offset = CIRCUMFERENCE * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;

            // 颜色状态
            timerDisplay.classList.remove('warning', 'danger');
            progressCircle.classList.remove('warning', 'danger');

            if (remainingSeconds <= 30) {
                timerDisplay.classList.add('danger');
                progressCircle.classList.add('danger');
            } else if (remainingSeconds <= 60) {
                timerDisplay.classList.add('warning');
                progressCircle.classList.add('warning');
            }
        }

        function startTimer() {
            if (isRunning) return;
            if (remainingSeconds <= 0) return;

            isRunning = true;
            btnStart.disabled = true;
            btnPause.disabled = false;
            statusText.textContent = '运行中';

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    stopTimer();
                    statusText.textContent = '时间到！';
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            stopTimer();
            statusText.textContent = '已暂停';
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            btnStart.disabled = remainingSeconds <= 0;
            btnPause.disabled = true;
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = TOTAL_SECONDS;
            updateDisplay();
            btnStart.disabled = false;
            btnPause.disabled = true;
            statusText.textContent = '就绪';
        }
    </script>
</body>
</html>
