<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5分钟倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 60px 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .timer {
            font-size: 120px;
            font-weight: 700;
            color: #e94560;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(233, 69, 96, 0.4);
            margin-bottom: 20px;
            line-height: 1;
        }

        .timer.warning {
            color: #f5a623;
            text-shadow: 0 0 40px rgba(245, 166, 35, 0.5);
            animation: pulse 0.8s ease-in-out infinite;
        }

        .timer.danger {
            color: #e94560;
            text-shadow: 0 0 60px rgba(233, 69, 96, 0.7);
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .progress-ring {
            transform: rotate(-90deg);
            margin-bottom: 30px;
        }

        .progress-ring__bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .progress-ring__fill {
            fill: none;
            stroke: #e94560;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
        }

        .progress-ring__fill.warning {
            stroke: #f5a623;
        }

        .progress-ring__fill.danger {
            stroke: #e94560;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
            min-width: 100px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4ecca3;
            color: #1a1a2e;
        }
        .btn-start:hover {
            background: #5fe0b8;
            box-shadow: 0 8px 25px rgba(78, 204, 163, 0.4);
        }

        .btn-pause {
            background: #f5a623;
            color: #1a1a2e;
        }
        .btn-pause:hover {
            background: #f7b84e;
            box-shadow: 0 8px 25px rgba(245, 166, 35, 0.4);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===== 贪吃蛇游戏样式 ===== */
        .snake-section {
            margin-top: 40px;
            text-align: center;
        }
        .snake-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .snake-wrapper {
            display: inline-block;
            background: #0d1b2a;
            border-radius: 12px;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .snake-canvas {
            display: block;
            border-radius: 8px;
        }
        .snake-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }
        .snake-score {
            color: #4ecca3;
            font-weight: 700;
            font-size: 18px;
        }
        .snake-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }
        .btn-snake {
            padding: 8px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4ecca3;
            color: #1a1a2e;
            transition: all 0.25s ease;
        }
        .btn-snake:hover {
            background: #5fe0b8;
            box-shadow: 0 6px 20px rgba(78, 204, 163, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="progress-ring" width="220" height="220" viewBox="0 0 220 220">
            <circle class="progress-ring__bg" cx="110" cy="110" r="100" />
            <circle class="progress-ring__fill" cx="110" cy="110" r="100" id="progressCircle" />
        </svg>

        <div class="timer" id="timerDisplay">05:00</div>

        <div class="buttons">
            <button class="btn-start" id="btnStart" onclick="startTimer()">开 始</button>
            <button class="btn-pause" id="btnPause" onclick="pauseTimer()" disabled>暂 停</button>
            <button class="btn-reset" id="btnReset" onclick="resetTimer()">重 置</button>
        </div>

        <div class="status" id="statusText">就绪</div>
    </div>

    <!-- 贪吃蛇游戏 -->
    <div class="snake-section">
        <div class="snake-title">🐍 贪吃蛇</div>
        <div class="snake-wrapper">
            <canvas class="snake-canvas" id="snakeCanvas" width="400" height="400"></canvas>
            <div class="snake-info">
                <span>得分：<span class="snake-score" id="snakeScore">0</span></span>
                <button class="btn-snake" id="btnSnake" onclick="startSnakeGame()">开始游戏</button>
            </div>
        </div>
        <div class="snake-hint">使用 ↑ ↓ ← → 方向键控制蛇的移动</div>
    </div>

    <script>
        const TOTAL_SECONDS = 5 * 60; // 5分钟 = 300秒
        const CIRCUMFERENCE = 2 * Math.PI * 100; // 圆周长 ≈ 628.32

        let remainingSeconds = TOTAL_SECONDS;
        let timerInterval = null;
        let isRunning = false;

        // DOM 元素
        const timerDisplay = document.getElementById('timerDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const statusText = document.getElementById('statusText');

        // 初始化进度环
        progressCircle.style.strokeDasharray = CIRCUMFERENCE;
        progressCircle.style.strokeDashoffset = '0';

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(remainingSeconds);

            // 更新进度环
            const progress = remainingSeconds / TOTAL_SECONDS;
            const offset = CIRCUMFERENCE * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;

            // 颜色状态
            timerDisplay.classList.remove('warning', 'danger');
            progressCircle.classList.remove('warning', 'danger');

            if (remainingSeconds <= 30) {
                timerDisplay.classList.add('danger');
                progressCircle.classList.add('danger');
            } else if (remainingSeconds <= 60) {
                timerDisplay.classList.add('warning');
                progressCircle.classList.add('warning');
            }
        }

        function startTimer() {
            if (isRunning) return;
            if (remainingSeconds <= 0) return;

            isRunning = true;
            btnStart.disabled = true;
            btnPause.disabled = false;
            statusText.textContent = '运行中';

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    stopTimer();
                    statusText.textContent = '时间到！';
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            stopTimer();
            statusText.textContent = '已暂停';
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            btnStart.disabled = remainingSeconds <= 0;
            btnPause.disabled = true;
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = TOTAL_SECONDS;
            updateDisplay();
            btnStart.disabled = false;
            btnPause.disabled = true;
            statusText.textContent = '就绪';
        }

        // ===== 贪吃蛇游戏 =====
        const snakeCanvas = document.getElementById('snakeCanvas');
        const snakeCtx = snakeCanvas.getContext('2d');
        const snakeScoreEl = document.getElementById('snakeScore');
        const btnSnake = document.getElementById('btnSnake');

        const GRID_SIZE = 20;        // 每格 20 像素
        const GRID_COUNT = 20;       // 20×20 方格
        const TICK_MS = 120;         // 蛇移动速度（毫秒）

        let snake = [];              // 蛇的身体坐标数组
        let food = null;             // 食物的坐标
        let direction = null;        // 当前方向
        let nextDirection = null;    // 缓冲的方向（防止快速按键bug）
        let snakeInterval = null;
        let snakeScore = 0;
        let snakeRunning = false;

        function initSnake() {
            // 蛇初始位置：中间偏左，长度 4 格，向右移动
            const startX = Math.floor(GRID_COUNT / 2);
            const startY = Math.floor(GRID_COUNT / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
                { x: startX - 3, y: startY },
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            snakeScore = 0;
            snakeScoreEl.textContent = '0';
            spawnFood();
            drawSnake();
        }

        function spawnFood() {
            // 随机找一个不在蛇身上的格子
            const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
            const freeCells = [];
            for (let x = 0; x < GRID_COUNT; x++) {
                for (let y = 0; y < GRID_COUNT; y++) {
                    if (!occupied.has(`${x},${y}`)) {
                        freeCells.push({ x, y });
                    }
                }
            }
            if (freeCells.length === 0) return; // 蛇占满网格，胜利
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
        }

        function drawSnake() {
            // 画背景
            snakeCtx.fillStyle = '#0d1b2a';
            snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

            // 画网格线
            snakeCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            snakeCtx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_COUNT; i++) {
                snakeCtx.beginPath();
                snakeCtx.moveTo(i * GRID_SIZE, 0);
                snakeCtx.lineTo(i * GRID_SIZE, snakeCanvas.height);
                snakeCtx.stroke();
                snakeCtx.beginPath();
                snakeCtx.moveTo(0, i * GRID_SIZE);
                snakeCtx.lineTo(snakeCanvas.width, i * GRID_SIZE);
                snakeCtx.stroke();
            }

            // 画食物
            if (food) {
                snakeCtx.fillStyle = '#e94560';
                snakeCtx.shadowColor = 'rgba(233, 69, 96, 0.6)';
                snakeCtx.shadowBlur = 8;
                snakeCtx.beginPath();
                snakeCtx.arc(
                    food.x * GRID_SIZE + GRID_SIZE / 2,
                    food.y * GRID_SIZE + GRID_SIZE / 2,
                    GRID_SIZE / 2 - 1,
                    0,
                    Math.PI * 2
                );
                snakeCtx.fill();
                snakeCtx.shadowBlur = 0;
            }

            // 画蛇身
            snake.forEach((seg, i) => {
                const alpha = i === 0 ? 1 : 0.7; // 蛇头更亮
                snakeCtx.fillStyle = i === 0 ? '#4ecca3' : `rgba(78, 204, 163, ${alpha})`;
                snakeCtx.shadowColor = i === 0 ? 'rgba(78, 204, 163, 0.5)' : 'transparent';
                snakeCtx.shadowBlur = i === 0 ? 6 : 0;
                snakeCtx.fillRect(
                    seg.x * GRID_SIZE + 1,
                    seg.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
                snakeCtx.shadowBlur = 0;
            });
        }

        function snakeTick() {
            // 应用缓冲的方向
            direction.x = nextDirection.x;
            direction.y = nextDirection.y;

            // 计算新蛇头位置
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y,
            };

            // 检查撞墙
            if (newHead.x < 0 || newHead.x >= GRID_COUNT || newHead.y < 0 || newHead.y >= GRID_COUNT) {
                gameOver();
                return;
            }

            // 检查撞自己（如果这帧不吃食物，尾巴会移走，排除尾巴）
            const eating = food && newHead.x === food.x && newHead.y === food.y;
            const bodyToCheck = eating ? snake : snake.slice(0, -1);
            if (bodyToCheck.some(s => s.x === newHead.x && s.y === newHead.y)) {
                gameOver();
                return;
            }

            // 蛇头前进
            snake.unshift(newHead);

            // 检查是否吃到食物
            if (eating) {
                snakeScore++;
                snakeScoreEl.textContent = snakeScore;
                spawnFood();
                if (!food) {
                    // 网格已满，玩家获胜！
                    stopSnake();
                    snakeCtx.fillStyle = 'rgba(78, 204, 163, 0.2)';
                    snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
                    snakeCtx.fillStyle = '#4ecca3';
                    snakeCtx.font = 'bold 28px "Microsoft YaHei", sans-serif';
                    snakeCtx.textAlign = 'center';
                    snakeCtx.fillText('恭喜通关！', snakeCanvas.width / 2, snakeCanvas.height / 2);
                    btnSnake.textContent = '再来一局';
                    return;
                }
                // 食物被吃后不删尾巴 = 蛇变长
            } else {
                snake.pop(); // 没吃到食物就删尾巴
            }

            drawSnake();
        }

        function gameOver() {
            stopSnake();
            // 闪烁红色提示
            snakeCtx.fillStyle = 'rgba(233, 69, 96, 0.2)';
            snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
            snakeCtx.fillStyle = '#e94560';
            snakeCtx.font = 'bold 28px "Microsoft YaHei", sans-serif';
            snakeCtx.textAlign = 'center';
            snakeCtx.fillText('游戏结束！', snakeCanvas.width / 2, snakeCanvas.height / 2);
            btnSnake.textContent = '重新开始';
        }

        function stopSnake() {
            clearInterval(snakeInterval);
            snakeInterval = null;
            snakeRunning = false;
        }

        function startSnakeGame() {
            stopSnake();
            initSnake();
            btnSnake.textContent = '重新开始';
            snakeRunning = true;
            snakeInterval = setInterval(snakeTick, TICK_MS);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (!snakeRunning) return;

            let handled = true;
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
                default:
                    handled = false;
            }
            if (handled) e.preventDefault();
        });

        // 初始画出静止的蛇
        initSnake();
        stopSnake(); // 确保计时器是停的，等用户点开始
    </script>
</body>
</html>
