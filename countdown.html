<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5分钟倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 60px 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .timer {
            font-size: 120px;
            font-weight: 700;
            color: #e94560;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(233, 69, 96, 0.4);
            margin-bottom: 20px;
            line-height: 1;
        }

        .timer.warning {
            color: #f5a623;
            text-shadow: 0 0 40px rgba(245, 166, 35, 0.5);
            animation: pulse 0.8s ease-in-out infinite;
        }

        .timer.danger {
            color: #e94560;
            text-shadow: 0 0 60px rgba(233, 69, 96, 0.7);
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .progress-ring {
            transform: rotate(-90deg);
            margin-bottom: 30px;
        }

        .progress-ring__bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .progress-ring__fill {
            fill: none;
            stroke: #e94560;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
        }

        .progress-ring__fill.warning {
            stroke: #f5a623;
        }

        .progress-ring__fill.danger {
            stroke: #e94560;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
            min-width: 100px;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-start {
            background: #4ecca3;
            color: #1a1a2e;
        }
        .btn-start:hover {
            background: #5fe0b8;
            box-shadow: 0 8px 25px rgba(78, 204, 163, 0.4);
        }

        .btn-pause {
            background: #f5a623;
            color: #1a1a2e;
        }
        .btn-pause:hover {
            background: #f7b84e;
            box-shadow: 0 8px 25px rgba(245, 166, 35, 0.4);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===== 贪吃蛇游戏样式 ===== */
        .snake-section {
            margin-top: 40px;
            text-align: center;
        }
        .snake-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .snake-wrapper {
            display: inline-block;
            background: #0d1b2a;
            border-radius: 12px;
            padding: 8px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .snake-canvas {
            display: block;
            border-radius: 8px;
        }
        .snake-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }
        .snake-score {
            color: #4ecca3;
            font-weight: 700;
            font-size: 18px;
        }
        .snake-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }
        .btn-snake {
            padding: 8px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4ecca3;
            color: #1a1a2e;
            transition: all 0.25s ease;
        }
        .btn-snake:hover {
            background: #5fe0b8;
            box-shadow: 0 6px 20px rgba(78, 204, 163, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="progress-ring" width="220" height="220" viewBox="0 0 220 220">
            <circle class="progress-ring__bg" cx="110" cy="110" r="100" />
            <circle class="progress-ring__fill" cx="110" cy="110" r="100" id="progressCircle" />
        </svg>

        <div class="timer" id="timerDisplay">05:00</div>

        <div class="buttons">
            <button class="btn-start" id="btnStart">开 始</button>
            <button class="btn-pause" id="btnPause" disabled>暂 停</button>
            <button class="btn-reset" id="btnReset">重 置</button>
        </div>

        <div class="status" id="statusText">就绪</div>
    </div>

    <!-- 贪吃蛇游戏 -->
    <div class="snake-section">
        <div class="snake-title">🐍 贪吃蛇</div>
        <div class="snake-wrapper">
            <canvas class="snake-canvas" id="snakeCanvas" width="400" height="400"></canvas>
            <div class="snake-info">
                <span>得分：<span class="snake-score" id="snakeScore">0</span></span>
                <button class="btn-snake" id="btnSnake">开始游戏</button>
            </div>
        </div>
        <div class="snake-hint">使用 ↑ ↓ ← → 方向键控制蛇的移动</div>
    </div>

    <script>
        // ──────────────────────────────────────
        // 变量和常量定义
        // ──────────────────────────────────────
        const TOTAL_SECONDS = 5 * 60;          // 5分钟 = 300秒
        const CIRCUMFERENCE = 2 * Math.PI * 100; // 圆周长 ≈ 628.32（用于进度环）

        let remainingSeconds = TOTAL_SECONDS;   // 剩余秒数
        let timerInterval = null;              // 计时器的 ID（用于取消）
        let isRunning = false;                 // 倒计时是否正在运行

        // ──────────────────────────────────────
        // 获取页面上需要用到的元素（缓存起来，避免反复查找 DOM）
        // ──────────────────────────────────────
        const timerDisplay = document.getElementById('timerDisplay');
        const progressCircle = document.getElementById('progressCircle');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnReset = document.getElementById('btnReset');
        const statusText = document.getElementById('statusText');

        // 初始化进度环样式
        progressCircle.style.strokeDasharray = CIRCUMFERENCE;
        progressCircle.style.strokeDashoffset = '0';

        // 用 addEventListener 绑定按钮事件（把行为和 HTML 结构分离，更规范）
        btnStart.addEventListener('click', startTimer);
        btnPause.addEventListener('click', pauseTimer);
        btnReset.addEventListener('click', resetTimer);

        // ──────────────────────────────────────
        // 倒计时模块
        // ──────────────────────────────────────

        /**
         * 把秒数格式化成 MM:SS 的显示格式
         * @param {number} seconds — 总秒数
         * @returns {string} 例如 formatTime(65) → "01:05"
         */
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        /**
         * 更新页面上的显示内容：时间数字 + 圆形进度环 + 颜色状态
         * 同时根据剩余时间切换三种颜色模式：
         *   > 60秒   → 默认红色（正常）
         *   30~60秒  → 橙色（警告，带脉冲动画）
         *   < 30秒   → 红色闪烁（危险）
         */
        function updateDisplay() {
            // 更新中间的数字（如 03:25）
            timerDisplay.textContent = formatTime(remainingSeconds);

            // 更新外面的圆形进度环：已用时间越多，缺口越大
            const progress = remainingSeconds / TOTAL_SECONDS;
            const offset = CIRCUMFERENCE * (1 - progress);
            progressCircle.style.strokeDashoffset = offset;

            // 清除之前的颜色状态
            timerDisplay.classList.remove('warning', 'danger');
            progressCircle.classList.remove('warning', 'danger');

            if (remainingSeconds <= 30) {
                timerDisplay.classList.add('danger');
                progressCircle.classList.add('danger');
            } else if (remainingSeconds <= 60) {
                timerDisplay.classList.add('warning');
                progressCircle.classList.add('warning');
            }
        }

        /**
         * 启动倒计时
         * - 如果已经在跑了，不再重复启动
         * - 如果时间已经用完（≤ 0），不允许启动
         */
        function startTimer() {
            if (isRunning) return;
            if (remainingSeconds <= 0) return;

            isRunning = true;
            btnStart.disabled = true;
            btnPause.disabled = false;
            statusText.textContent = '运行中';

            // 每隔 1 秒减 1，更新界面
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    stopTimer();
                    statusText.textContent = '时间到！';
                }
            }, 1000);
        }

        /**
         * 暂停倒计时（不重置时间）
         */
        function pauseTimer() {
            if (!isRunning) return;
            stopTimer();
            statusText.textContent = '已暂停';
        }

        /**
         * 停止计时器的内部实现：清除定时器 + 恢复按钮状态
         */
        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            btnStart.disabled = remainingSeconds <= 0;
            btnPause.disabled = true;
        }

        /**
         * 重置倒计时：停止 → 恢复到 5分钟 → 重新显示
         */
        function resetTimer() {
            stopTimer();
            remainingSeconds = TOTAL_SECONDS;
            updateDisplay();
            btnStart.disabled = false;
            btnPause.disabled = true;
            statusText.textContent = '就绪';
        }

        // ──────────────────────────────────────
        // 贪吃蛇游戏模块
        // ──────────────────────────────────────

        // 获取蛇游戏的页面上需要用到的元素
        const snakeCanvas = document.getElementById('snakeCanvas');
        const snakeCtx = snakeCanvas.getContext('2d');
        const snakeScoreEl = document.getElementById('snakeScore');
        const btnSnake = document.getElementById('btnSnake');

        const GRID_SIZE = 20;        // 每小格 20 像素（画布是 400×400，所以是 20×20 的棋盘）
        const GRID_COUNT = 20;       // 横向和纵向各有 20 格
        const TICK_MS = 120;         // 蛇每隔 120 毫秒移动一格（数字越小蛇越快）

        let snake = [];              // 蛇身体的坐标数组，第一个元素是蛇头
        let food = null;             // 当前食物的坐标 {x, y}
        let direction = null;        // 蛇当前移动的方向 {x, y}
        let nextDirection = null;    // 缓冲方向：快速按两个键时，防止蛇反向撞到自己
        let snakeInterval = null;    // 蛇移动计时器的 ID
        let snakeScore = 0;          // 当前得分
        let snakeRunning = false;    // 蛇是否正在移动

        /**
         * 初始化蛇的状态：放在画面中央，长度 4 格，朝右移动
         */
        function initSnake() {
            const startX = Math.floor(GRID_COUNT / 2);
            const startY = Math.floor(GRID_COUNT / 2);
            snake = [
                { x: startX, y: startY },      // 蛇头
                { x: startX - 1, y: startY },  // 身体第1节
                { x: startX - 2, y: startY },  // 身体第2节
                { x: startX - 3, y: startY },  // 蛇尾
            ];
            direction = { x: 1, y: 0 };       // x=1 表示每步向右移动一格
            nextDirection = { x: 1, y: 0 };
            snakeScore = 0;
            snakeScoreEl.textContent = '0';
            spawnFood();
            drawSnake();
        }

        /**
         * 在空白格子里随机放一个食物
         * 思路：先算出所有蛇没占据的格子，再从里面随机选一个
         */
        function spawnFood() {
            // 把蛇身体的坐标转成字符串集合，方便快速查找"这个格子有没有蛇"
            const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
            const freeCells = [];
            for (let x = 0; x < GRID_COUNT; x++) {
                for (let y = 0; y < GRID_COUNT; y++) {
                    if (!occupied.has(`${x},${y}`)) {
                        freeCells.push({ x, y });
                    }
                }
            }
            if (freeCells.length === 0) return; // 没有空格子了 = 玩家已通关！
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
        }

        /**
         * 在画布上画出蛇 + 食物 + 网格线的一整帧画面
         * 每次蛇移动后调用，刷新整个游戏画面
         */
        function drawSnake() {
            // ── 画背景：用深蓝色填充整个画布 ──
            snakeCtx.fillStyle = '#0d1b2a';
            snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

            // ── 画淡淡的网格线（帮助看清格子位置）──
            snakeCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            snakeCtx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_COUNT; i++) {
                snakeCtx.beginPath();
                snakeCtx.moveTo(i * GRID_SIZE, 0);
                snakeCtx.lineTo(i * GRID_SIZE, snakeCanvas.height);
                snakeCtx.stroke();
                snakeCtx.beginPath();
                snakeCtx.moveTo(0, i * GRID_SIZE);
                snakeCtx.lineTo(snakeCanvas.width, i * GRID_SIZE);
                snakeCtx.stroke();
            }

            // ── 画食物：红色圆点，带发光效果 ──
            if (food) {
                snakeCtx.fillStyle = '#e94560';
                snakeCtx.shadowColor = 'rgba(233, 69, 96, 0.6)';
                snakeCtx.shadowBlur = 8;
                snakeCtx.beginPath();
                snakeCtx.arc(
                    food.x * GRID_SIZE + GRID_SIZE / 2,
                    food.y * GRID_SIZE + GRID_SIZE / 2,
                    GRID_SIZE / 2 - 1,
                    0,
                    Math.PI * 2
                );
                snakeCtx.fill();
                snakeCtx.shadowBlur = 0; // 画完食物后关掉发光（避免影响后面的绘制）
            }

            // ── 画蛇身：逐格画出蛇的每一节 ──
            // 蛇头用亮绿色（带发光），蛇身用半透明绿色
            snake.forEach((seg, i) => {
                const alpha = i === 0 ? 1 : 0.7;      // 蛇头 = 不透明，蛇身 = 70% 透明
                snakeCtx.fillStyle = i === 0 ? '#4ecca3' : `rgba(78, 204, 163, ${alpha})`;
                snakeCtx.shadowColor = i === 0 ? 'rgba(78, 204, 163, 0.5)' : 'transparent';
                snakeCtx.shadowBlur = i === 0 ? 6 : 0;
                snakeCtx.fillRect(
                    seg.x * GRID_SIZE + 1,
                    seg.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );
                snakeCtx.shadowBlur = 0;
            });
        }

        /**
         * 在画布上显示半透明蒙层 + 居中提示文字（通关和游戏结束共用）
         * @param {string} overlayColor — 半透明蒙层的颜色（如 'rgba(78, 204, 163, 0.2)'）
         * @param {string} textColor    — 提示文字的颜色（如 '#4ecca3'）
         * @param {string} text         — 显示的提示文字
         */
        function showGameOverlay(overlayColor, textColor, text) {
            // 画半透明蒙层，让底层蛇和食物隐约可见
            snakeCtx.fillStyle = overlayColor;
            snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
            // 画居中提示文字
            snakeCtx.fillStyle = textColor;
            snakeCtx.font = 'bold 28px "Microsoft YaHei", sans-serif';
            snakeCtx.textAlign = 'center';
            snakeCtx.fillText(text, snakeCanvas.width / 2, snakeCanvas.height / 2);
        }

        /**
         * 检查蛇头是否撞墙（超出画布边界）
         * @param {object} head — 蛇头坐标 {x, y}
         * @returns {boolean} true = 撞了
         */
        function checkWallCollision(head) {
            return head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT;
        }

        /**
         * 检查蛇头是否撞到自己的身体
         * @param {object} head — 蛇头坐标
         * @param {boolean} eating — 这帧是否吃到食物（吃到的话尾巴不移走，不检查尾部）
         * @returns {boolean} true = 撞了
         */
        function checkSelfCollision(head, eating) {
            // 如果这帧不吃食物，尾巴会移走，所以排除尾巴那一格
            const bodyToCheck = eating ? snake : snake.slice(0, -1);
            return bodyToCheck.some(s => s.x === head.x && s.y === head.y);
        }

        /**
         * 蛇移动一帧的核心逻辑：
         * 1. 应用方向 → 2. 检查碰撞 → 3. 移动蛇头 → 4. 处理食物 → 5. 重绘
         * 每一帧（120ms）调用一次
         */
        function snakeTick() {
            // 把缓冲的方向应用到当前方向
            direction.x = nextDirection.x;
            direction.y = nextDirection.y;

            // 根据当前方向计算这一帧蛇头的新位置
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y,
            };

            // ── 碰撞检测：撞墙？ ──
            if (checkWallCollision(newHead)) {
                gameOver();
                return;
            }

            // ── 碰撞检测：撞到自己？ ──
            const eating = food && newHead.x === food.x && newHead.y === food.y;
            if (checkSelfCollision(newHead, eating)) {
                gameOver();
                return;
            }

            // ── 蛇头前进一格 ──
            snake.unshift(newHead);

            // ── 处理食物 ──
            if (eating) {
                // 吃到食物：加分 + 生新食物 + 尾巴不删 = 蛇变长一格
                snakeScore++;
                snakeScoreEl.textContent = snakeScore;
                spawnFood();
                if (!food) {
                    // 没有空格子了 = 玩家赢了！
                    stopSnake();
                    showGameOverlay('rgba(78, 204, 163, 0.2)', '#4ecca3', '恭喜通关！');
                    btnSnake.textContent = '再来一局';
                    return;
                }
            } else {
                // 没吃到食物：删掉尾巴 = 蛇长度不变
                snake.pop();
            }

            drawSnake();
        }

        /**
         * 游戏结束：停止蛇 + 显示红色蒙层提示
         */
        function gameOver() {
            stopSnake();
            showGameOverlay('rgba(233, 69, 96, 0.2)', '#e94560', '游戏结束！');
            btnSnake.textContent = '重新开始';
        }

        /**
         * 停止蛇的移动计时器
         */
        function stopSnake() {
            clearInterval(snakeInterval);
            snakeInterval = null;
            snakeRunning = false;
        }

        /**
         * 启动蛇游戏（或重新开始）
         */
        function startSnakeGame() {
            stopSnake();        // 先停掉上一局
            initSnake();        // 初始化蛇的数据
            btnSnake.textContent = '重新开始';
            snakeRunning = true;
            snakeInterval = setInterval(snakeTick, TICK_MS);  // 每 120ms 移动一格
        }

        // 绑定蛇游戏的按钮事件
        btnSnake.addEventListener('click', startSnakeGame);

        // ──────────────────────────────────────
        // 键盘控制：方向键或 WASD
        // 用 nextDirection 做缓冲，防止在同一帧内快速按两个相反方向导致蛇撞自己
        // ──────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (!snakeRunning) return;

            let handled = true;
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    // 只有当前不是向下时才能向上（防止掉头）
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
                default:
                    handled = false;
            }
            if (handled) e.preventDefault(); // 阻止方向键滚页面
        });

        // 初始画出静止的蛇（动画不会跑，需要用户点击"开始游戏"）
        initSnake();
        stopSnake();
    </script>
</body>
</html>
